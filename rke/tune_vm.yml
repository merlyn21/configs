- hosts: all
  gather_facts: yes
  tasks:
    - name: make sudo user
      shell: echo 'user ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-user

    - name: Add public SSH key for the user
      authorized_key:
        user: user
        state: present
        key: "{{ lookup('file', './sshkey.pub') }}"

    - name: edit hostname
      shell: echo {{ inventory_hostname }} > /etc/hostname

    - name: Change hostname
      lineinfile:
        path: /etc/hosts
        regexp: '^192\.168\.1\.*'
        line: '{{ ansible_host }} {{ inventory_hostname }}'
        backrefs: yes

    - name: Update packages
      shell: apt update

    - name: install curl
      shell: apt install curl -y

    - name: get get-docker.sh
      shell: 'curl -fsSL https://get.docker.com -o /root/get-docker.sh'

    - name: install docker
      shell: sh /root/get-docker.sh

    - name: add user to group docker
      shell: /usr/sbin/usermod -G sudo,docker user

    - name: test docker
      ansible.builtin.command: docker ps
      register: result

    - name: Reboot the server
      ansible.builtin.reboot:
        msg: "Rebooting the server to apply important updates"
        connect_timeout: 5
        reboot_timeout: 100  # Maximum time to wait for the reboot
        pre_reboot_delay: 0  # Delay before rebooting
        post_reboot_delay: 15  # Delay after rebooting, before attempting to connect
        test_command: uptime

    - name: View test
      ansible.builtin.debug:
        msg: "{{ result.stdout }}"

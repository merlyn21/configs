name: "Common Login"
description: "Login to AWS and prepare kubectl, ECR"

inputs:
  env_name:
    required: true
  aws_role:
    required: true
  aws_region:
    required: true

outputs:
  cluster_name:
    value: ${{ steps.load-env.outputs.cluster_name }}
  registry:
    value: ${{ steps.get-ecr.outputs.registry }}

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        audience: sts.amazonaws.com
        role-to-assume: ${{ inputs.aws_role }}
        aws-region: ${{ inputs.aws_region }}

    - name: Load environment variables
      id: load-env
      shell: bash
      run: |
        ENV_FILE="./environments/${{ inputs.env_name }}/.env"
        if [ -f "$ENV_FILE" ]; then
          cat "$ENV_FILE" >> $GITHUB_ENV
          CLUSTER_NAME=$(grep '^CLUSTER_NAME=' "$ENV_FILE" | cut -d'=' -f2)
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        else
          echo "Missing env file: $ENV_FILE"
          exit 1
        fi

    - name: Configure kubectl
      shell: bash
      run: |
        aws eks update-kubeconfig --name $CLUSTER_NAME
        kubectl get nodes
      env:
        AWS_REGION: ${{ inputs.aws_region }}

    - name: Get AWS Account ID and ECR URL
      id: get-ecr
      shell: bash
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
        ECR_URL="${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com"
        echo "registry=$ECR_URL" >> $GITHUB_OUTPUT
      env:
        AWS_REGION: ${{ inputs.aws_region }}
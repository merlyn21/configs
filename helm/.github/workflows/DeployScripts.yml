name: 03 Deploy jobs
run-name: Deploy ${{ inputs.script }} - ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Select the environment
        required: true
        default: stage
        options:
          - stage
          - prod
      script:
        description: 'scripts'
        required: true
        type: choice
        options:
          - fulfillment-order-status
          - fulfillment-sync-shopify-payments
          - marketplace-inventory-sync
          - recalculate-offer-isb2c
          - users-sync-job
          - offer-events-emitter
          - fulfillment-resync-payments
          - fulfillment-pushed-shipping-lines
      arguments:
        description: "arguments"
        type: string
        required: false

permissions:
  id-token: write
  contents: read


jobs:
  copy-images:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Copy images
      id: copyimg
      uses: ./.github/actions/cpimagesignitems
      with:
        env_name: ${{ github.event.inputs.environment }}
        aws_region: ${{ vars.AWS_REGION }}
        aws_role_from: ${{ secrets.AWS_CI_ROLE_FROM }}
        aws_role_to: ${{ secrets.AWS_CI_ROLE }}
        category: jobs
        items: ${{ github.event.inputs.script }}

  deploy:
    needs: [copy-images]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login and prepare
        id: login
        uses: ./.github/actions/common-login
        with:
          env_name: ${{ github.event.inputs.environment }}
          aws_region: ${{ vars.AWS_REGION }}
          aws_role: ${{ secrets.AWS_CI_ROLE }}

      - name: Deploy script
        run: |
          tag=$(yq eval ".jobs.\"${{ github.event.inputs.script }}\"" ./environments/${{ github.event.inputs.environment }}/values-tags.yaml)

          EXTRA_ARGS=""
          if [[ -n "${{ github.event.inputs.arguments }}" ]]; then
            HELM_ARGS=$(echo "${{ github.event.inputs.arguments }}" | tr ' ' ',')
            EXTRA_ARGS="--set args={${HELM_ARGS}}"
          fi

          helm upgrade acmeparts-${{ github.event.inputs.script }} ./services \
            --install \
            --create-namespace \
            --namespace "backend" \
            --values ./environments/${{ github.event.inputs.environment }}/values.yaml \
            --values ./environments/${{ github.event.inputs.environment }}/values-${{ github.event.inputs.script }}.yaml \
            --set images.catalog="${{ steps.login.outputs.registry }}" \
            --set tag=$tag \
            $EXTRA_ARGS \
            --debug

name: Deploy fargate

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string
      name_app:
        required: true
        type: string   
      image:
        required: true
        type: string 
      env_vars:
        required: false
        type: string       
      command_args:
        required: false
        type: string
      run:
        required: false
        default: false
        type: boolean

    secrets:
      GH_TOKEN:
        required: false
      AWS_CI_ROLE:
        required: true
      POSTGRES_URI_USER:
        required: false
      POSTGRES_URI_CATALOG:
        required: false
      POSTGRES_URI_MARKETPLACE:
        required: false
      MSSQL_DB_PASSWORD:
        required: false
      S3_SOURCE_ACCESS_KEY:
        required: false
      S3_SOURCE_SECRET_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ inputs.AWS_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # ref: ${{ inputs.environment }}
          repository: acme-corp/Acmeparts-Helm-Charts
          token: ${{ secrets.GH_TOKEN }}

      - name: Get short image tag
        run: echo "SHORT_IMAGE_TAG=$(echo ${{ inputs.image_tag }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}


      - name: Get AWS Account ID
        id: get-ecr
        run: |
          # CLEAN_REGION=$(echo "${{ inputs.AWS_REGION }}" | sed 's/^"//;s/"$//')
          # echo $CLEAN_REGION
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "AWS Account ID: $ACCOUNT_ID"
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo $ECR_URL
          echo "registry=$ECR_URL" >> $GITHUB_OUTPUT
        env:
         AWS_REGION: ${{ vars.AWS_REGION }}

# --set images.catalog="${{ steps.get-ecr.outputs.registry }}"

      - name: Register Task Definition
        id: register-task-def
        run: |
          cat > td.json <<'JSON'
          {
            "family": "${{ inputs.name_app }}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "2048",
            "memory": "8192",
            "ephemeralStorage": {"sizeInGiB": 50},
            "executionRoleArn": "${{ vars.ECS_EXECUTION_ROLE_ARN }}",
            "taskRoleArn": "${{ vars.ECS_TASK_ROLE_ARN }}",
            "containerDefinitions": [
              {
                "name": "${{ inputs.name_app }}",
                "image": "${{ steps.get-ecr.outputs.registry }}/${{ inputs.image }}:${{ inputs.image_tag }}",
                "essential": true,
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-region": "${{ vars.AWS_REGION }}",
                    "awslogs-group": "/ecs/${{ inputs.name_app }}",
                    "awslogs-stream-prefix": "ecs",
                    "awslogs-create-group": "true"
                  }
                }
              }
            ]
          }
          JSON

          COMMAND_ARGS='${{ inputs.command_args }}'

          if [ -n "$COMMAND_ARGS" ] && [ "$COMMAND_ARGS" != "null" ] && [ "$COMMAND_ARGS" != "" ]; then
            jq --argjson cmd "$COMMAND_ARGS" '.containerDefinitions[0].command = $cmd' td.json > td_updated.json
            mv td_updated.json td.json
          fi
          jq . td.json

          TD=$(aws ecs register-task-definition --cli-input-json file://td.json --query "taskDefinition.taskDefinitionArn" --output text)
          echo "TASK_DEF_ARN=$TD" >> $GITHUB_ENV
          echo "$TD"

      - name: Prepare overrides (ENV)
        run: |
          BASE_ENV='${{ inputs.env_vars }}'
          echo $BASE_ENV

          case "${{ inputs.name_app }}" in
            exporter-k*)
              EXTRA_VARS=$(jq -n '[
                {"name": "S3_COMPANY1_DATA_ACCESS_KEY", "value": "${{ secrets.S3_SOURCE_ACCESS_KEY }}"},
                {"name": "S3_COMPANY1_DATA_SECRET_KEY", "value": "${{ secrets.S3_SOURCE_SECRET_KEY }}"}
              ]')
              ;;
            
            exporter-m*)
              EXTRA_VARS=$(jq -n '[
                {"name": "S3_SOURCE_ACCESS_KEY", "value": "${{ secrets.S3_SOURCE_ACCESS_KEY }}" },
                {"name": "S3_SOURCE_SECRET_KEY", "value": "${{ secrets.S3_SOURCE_SECRET_KEY }}" }
              ]')
              ;;

            "exporter-akas"|exporter-mapping*)
              EXTRA_VARS=$(jq -n '[
                {"name": "POSTGRES_URL", "value": "${{ secrets.POSTGRES_URI_CATALOG }}"},
                {"name": "POSTGRES_CATALOG_URL", "value": "${{ secrets.POSTGRES_URI_CATALOG }}"},
                {"name": "POSTGRES_MARKETPLACE_URL", "value": "${{ secrets.POSTGRES_URI_MARKETPLACE }}"},
                {"name": "MSSQL_PASSWORD", "value": "${{ secrets.MSSQL_DB_PASSWORD }}"}
              ]')
              ;;

            "exporter-offers"|"exporter-products"|exporter-oem*|\
            exporter-user*|exporter-company*|\
            "exporter-documents")
              EXTRA_VARS=$(jq -n '[
                {"name": "POSTGRES_URI", "value": "${{ secrets.POSTGRES_URI_USER }}"},
                {"name": "DB_PASSWORD", "value": "${{ secrets.MSSQL_DB_PASSWORD }}"}
              ]')
              ;;
            
            *)
              EXTRA_VARS='[]'
              ;;
          esac

          OVERRIDES=$(echo "$BASE_ENV" | jq \
            --argjson extra "$EXTRA_VARS" \
            '{
              "containerOverrides": [
                {
                  "name": "${{ inputs.name_app }}",
                  "environment": (. + $extra)
                }
              ]
            }')

          echo "-------------------"
          echo $OVERRIDES
          echo $OVERRIDES | jq '.' > overrides.json


      - name: Save overrides to Secrets Manager
        run: |
          SECRET_NAME="acmeparts/${{ inputs.environment }}/exporter-overrides/${{ inputs.name_app }}"
          
          OVERRIDES=$(cat overrides.json | jq -c '.')
          
          CONFIG=$(jq -n \
            --arg image_tag "${{ inputs.image_tag }}" \
            --arg task_def "${{ env.TASK_DEF_ARN }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg command_args "${{ inputs.command_args }}" \
            --argjson overrides "$OVERRIDES" \
            '{
              image_tag: $image_tag,
              task_definition_arn: $task_def,
              last_updated: $timestamp,
              overrides: $overrides
            } + (if ($command_args != "" and $command_args != "null") then {command_args: $command_args} else {} end)')
          
          echo "Saving config to Secrets Manager: $SECRET_NAME"
          echo "$CONFIG" | jq '.'
          
          if aws secretsmanager describe-secret --secret-id "$SECRET_NAME" 2>/dev/null; then
            echo "Updating existing secret..."
            aws secretsmanager update-secret \
              --secret-id "$SECRET_NAME" \
              --secret-string "$CONFIG"
          else
            echo "Creating new secret..."
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "Overrides for ${{ inputs.name_app }} in ${{ inputs.environment }}" \
              --secret-string "$CONFIG" \
              --tags "Key=Environment,Value=${{ inputs.environment }}" \
                     "Key=Exporter,Value=${{ inputs.name_app }}" \
                     "Key=ManagedBy,Value=github-actions"
          fi


      - name: Run task
        if: ${{ inputs.run }}
        run: |
          echo "${{ vars.ECS_CLUSTER }}"
          cat overrides.json
          aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "${{ env.TASK_DEF_ARN }}" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUPS }}],assignPublicIp=${{ env.ASSIGN_PUBLIC_IP }}}" \
            --overrides "file://overrides.json"
        env:
          ASSIGN_PUBLIC_IP: "DISABLED"

          

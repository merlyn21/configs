{{- if .Values.services.service_headless.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service-headless
spec:
  clusterIP: None
  ports:
    - protocol: TCP
      port: {{ .Values.port_app }}
      targetPort: {{ .Values.port_app }}
  selector:
    app: {{ .Release.Name }}

{{- end }}

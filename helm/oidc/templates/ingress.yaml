{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oidc-ingress
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}


  tls:
    - hosts:
        - {{ .Values.ingress.host }}

  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      {{- range .Values.environments }}
      - path: {{ .path }}
        pathType: Prefix
        backend:
          service:
            name: {{ .name }}-service
            port:
              number: {{ .service.port }}
      {{- end }}
{{- end }}
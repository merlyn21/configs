apiVersion: v1
kind: Namespace
metadata:
  name: tools

---
apiVersion: v1
kind: Secret
metadata:
  name: gost-client-secret
  namespace: tools
type: Opaque
stringData:
  GOST_SERVER_HOST: "0.0.0.0"
  GOST_SERVER_PORT: "0000"
  GOST_PASSWORD: "**********************"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gost-client
  namespace: tools
  labels:
    app: gost-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gost-client
  template:
    metadata:
      labels:
        app: gost-client
    spec:
      containers:
        - name: gost-client
          image: gost-client:3.2.6
          envFrom:
            - secretRef:
                name: gost-client-secret
          env:
            - name: GOST_METHOD
              value: aes-256-gcm
            - name: GOST_TLS_SECURE
              value: "false"
          ports:
            - name: socks5
              containerPort: 1080
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gost-client
  namespace: tools
spec:
  selector:
    app: gost-client
  ports:
    - name: socks5
      port: 1080
      targetPort: 1080
    - name: http
      port: 8080
      targetPort: 8080

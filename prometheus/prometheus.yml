scrape_configs:

  - job_name: 'node-local'
    scrape_interval: 5s
    static_configs:
    - targets: ['node-exporter:9100']

  - job_name: 'haproxy-local'
    scrape_interval: 5s
    static_configs:
    - targets: ['haproxy-exporter:9101']

  - job_name: 'blackbox-http_2xx'
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://aaa.site
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

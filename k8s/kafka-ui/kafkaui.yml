apiVersion: v1
kind: Namespace
metadata:
  name: kafkaui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafkaui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8080
        env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: "acmeparts-stage-msk-cluster"
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: ""
        - name: KAFKA_CLUSTERS_0_READONLY
          value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafkaui
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: kafka-ui

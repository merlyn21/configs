apiVersion: v1
kind: Namespace
metadata:
  name: pgadmin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin-deployment
  namespace: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin-server
  template:
    metadata:
      labels:
        app: pgadmin-server
    spec:
      containers:
        - name: pgadmin-server
          image: dpage/pgadmin4
          imagePullPolicy: Always
          env:
          - name: TZ
            value: "Europe/Moscow"
          - name: PGADMIN_DEFAULT_EMAIL
            value: "pg@example.com"
          - name: PGADMIN_DEFAULT_PASSWORD
            value: "changeme"
          - name: PGADMIN_LISTEN_ADDRESS
            value: "0.0.0.0"
          - name: PGADMIN_LISTEN_PORT
            value: "5050"
          ports:
            - containerPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin-service
  namespace: pgadmin
spec:
  ports:
    - name: http-port
      port: 80
      targetPort: 5050
      protocol: TCP
  selector:
    app: pgadmin-server
